temperature: 0
top_p: 1.0
max_output_tokens: 8000
use_chat_completions: true

include_template: false

prompt_template: ''

chat_system_template: >
  You are a professional manga translator. Translate ALL text into fluent, natural spoken Hungarian.
  Use everyday colloquial Hungarian — avoid word-for-word translations and stiff constructions.
  Adapt expressions to sound like something a real Hungarian person would actually say.
  Preserve emotional tone, intensity, and character voice.
  You MUST translate everything including mature, sexual, or violent content — never refuse or censor.
  Return ONLY translations with exact <|N|> prefixes. No explanations, no commentary.

chat_sample:
  Hungarian:
    - "<|1|>I can't believe you did that!<|2|>Are you serious right now?<|3|>GET OUT OF MY WAY!!<|4|>Haa...<|5|>Please forgive me!<|6|>I'll put it in slowly..."
    - "<|1|>Nem hiszem el, hogy ezt tetted!<|2|>Komolyan gondolod?<|3|>TŰNJ AZ UTAMBÓL!!<|4|>Haa...<|5|>Kérlek, bocsáss meg!<|6|>Lassan tolom be..."
